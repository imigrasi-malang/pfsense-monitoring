services:
  snmp-exporter:
    image: prom/snmp-exporter:v0.26.0
    container_name: snmp-exporter
    restart: unless-stopped
    ports:
      - "9116:9116"
    networks:
      - monitoring

  # Menulis daftar target SNMP dari variabel .env ke volume yang dibaca Prometheus
  targets-init:
    image: busybox:1.36
    container_name: targets-init
    environment:
      PFSENSE_SNMP_TARGET: ${PFSENSE_SNMP_TARGET:?set PFSENSE_SNMP_TARGET in .env}
      PFSENSE_DEVICE_NAME: ${PFSENSE_DEVICE_NAME:-pfsense}
    command:
      - sh
      - -c
      - |
        printf -- '- targets: ["%s"]\n  labels:\n    device: "%s"\n' \
          "$$PFSENSE_SNMP_TARGET" "$$PFSENSE_DEVICE_NAME" > /targets/pfsense.yml
        cat /targets/pfsense.yml
    volumes:
      - prometheus-targets:/targets

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      snmp-exporter:
        condition: service_started
      targets-init:
        condition: service_completed_successfully
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?set GF_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus-data:
  prometheus-targets:
  grafana-data:
